databases:
  - name: openswe-db
    databaseName: openswe_db
    user: openswe_db_user
    region: oregon
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: openswe-studio-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -e vendor/managed-deepagents-sdk/packages/pypi && pip install -e packages/runtime-api && pip install -e .
    startCommand: LANGGRAPH_RUNTIME_EDITION=inmem REDIS_URI=redis://localhost:6379 uvicorn openswe.webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: POSTGRES_URI
        fromDatabase:
          name: openswe-db
          property: connectionString
      - key: DASHBOARD_ALLOWED_ORIGINS
        value: "https://open-swe-studio.vercel.app,https://open-swe-studio-git-main-kayalvizhij-2008-its-projects.vercel.app"
      - key: ALLOWED_GITHUB_USERS
        value: "kayalvizhij-2008-it"
      - key: OPENSWE_ENV
        value: "production"
      - key: REDIS_URI
        value: "redis://localhost:6379"
      - key: LANGGRAPH_RUNTIME_EDITION
        value: "inmem"
      - key: DASHBOARD_BASE_URL
        value: "https://open-swe-studio.vercel.app"
      - key: DASHBOARD_API_BASE_URL
        value: "https://openswe-studio-api.onrender.com"
      - key: LANGGRAPH_URL
        value: "https://openswe-studio-api.onrender.com"
